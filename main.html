
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Hero Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 50px;
            gap: 40px;
        }

        .hero-content {
            flex: 1;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #111;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
        }

        .hero img {
            width: 50%;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;
        }

        .hero a {
            display: inline-block;
            padding: 14px 28px;
            background-color: #e60023;
            color: #ffffff;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        .hero a:hover {
            background-color: #ad001b;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                justify-content: center;
                padding: 25px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero img {
                width: 100%;
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Discover Your Next Idea</h1>
            <p>Explore inspiration, creative ideas, and beautiful designs. Find something you love and start creating today.</p>
            <a href="https://www.pinterest.com/">Explore now</a>
        </div>

        <img src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Creative inspiration">
    </div>
</body>
</html>
